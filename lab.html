<!doctype html>
<!-- The V3 Deal Lab's front door: index.html with the lab as the entry (src/main.js labDoor).
     Published as the V3 preview Artifact; #venture still opens Venture Mode. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cluster Tycoon V3</title>
  <meta name="description" content="Compute finally has a floor. Find a counterparty, haggle, sign before the five o'clock bell.">
  <meta name="theme-color" content="#3A1911">

  <!-- Link previews on X, LinkedIn, Slack, iMessage. Crawlers don't run scripts, so these are literal.
       The image needs an absolute URL on the game's public address: uncomment once it's decided
       (and set BRAND.share.gameUrl in src/config.js). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Haight Street Compute">
  <meta property="og:title" content="The Floor · Haight Street Compute">
  <meta property="og:description" content="Compute finally has a floor. Find a counterparty, haggle, sign before the five o'clock bell.">
  <meta name="twitter:card" content="summary_large_image">
  <!--
  <meta property="og:image" content="https://GAME-ADDRESS/assets/og-floor-v1.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Oil has a floor. Stocks have a floor. Compute has a guy who knows a guy.">
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c-5 0-9 4-9 10v6l-3 4h24l-3-4v-6c0-6-4-10-9-10z' fill='%23B8913F' stroke='%231B1814' stroke-width='2'/%3E%3Ccircle cx='16' cy='27' r='3' fill='%231B1814'/%3E%3C/svg%3E">

  <!-- Free stand-ins for the brand faces (Cheltenham → Merriweather, News Gothic → News Cycle,
       Chicago → Jersey 10, dot-matrix → DotGothic16).
       One link per family so a single failure can't take the others down. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/intro.css">
  <link rel="stylesheet" href="styles/floor.css">
  <link rel="stylesheet" href="styles/deal.css">
  <link rel="stylesheet" href="styles/results.css">
  <link rel="stylesheet" href="styles/venture.css">
  <link rel="stylesheet" href="styles/lab.css">
</head>
<body>
  <!-- Shared SVG patterns: striped shirts. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="stripe-blue" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
        <rect width="4" height="4" fill="#EEF2F7"/><rect width="1.4" height="4" fill="#6F8FBF"/>
      </pattern>
      <pattern id="stripe-pink" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
        <rect width="4" height="4" fill="#F7EEEE"/><rect width="1.4" height="4" fill="#C9787A"/>
      </pattern>
    </defs>
  </svg>

  <main id="app" data-entry="lab" aria-live="polite"></main>

  <div class="chrome">
    <button id="mute" class="btn" type="button" aria-pressed="true">SOUND ON</button>
  </div>

  <noscript><p style="color:#fff;padding:24px">The floor needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
